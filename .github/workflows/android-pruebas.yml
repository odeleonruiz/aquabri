name: AQUABRI Android - APK de pruebas
on:
  workflow_dispatch:
  push:
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/build-web.mjs'
      - '.github/workflows/android-pruebas.yml'
jobs:
  apk-debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Build Android project
        run: npm run android:init
      - name: Confirm Google Play target API
        run: |
          grep -R "targetSdkVersion = 36\|targetSdkVersion 36" android/variables.gradle android/app/build.gradle
      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: aquabri-android-apk-pruebas
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
