name: Aquabri Windows 8.1 Legacy Installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/prepare-win81-build.mjs'
      - '.github/workflows/windows81-installer.yml'
permissions:
  contents: read
jobs:
  installer:
    name: Compilar edicion compatible con Windows 8.1
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar instalador heredado sin alterar version moderna
        run: node prepare-win81-build.mjs
      - name: Instalar dependencias antiguas
        run: npm install --no-audit --no-fund
      - name: Crear instalador Windows 8.1
        run: npm run dist:win81
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publicar archivo instalable
        uses: actions/upload-artifact@v4
        with:
          name: Aquabri-System-Windows-8.1-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
