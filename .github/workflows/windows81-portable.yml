name: Aquabri Windows 8.1 Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows81-portable.yml'
permissions:
  contents: read
jobs:
  portable:
    name: Crear version sin instalador
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configurar Windows 8.1 de 32 bits
        run: node prepare-win81-build.mjs
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Preparar icono
        run: npm run prepare:icon
      - name: Empaquetar Aquabri sin asistente de instalacion
        run: npx electron-builder --win zip --ia32 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publicar ZIP del programa
        uses: actions/upload-artifact@v4
        with:
          name: Aquabri-System-Windows81-Portable
          path: desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30
